<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>hunter2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
  /* the loading screen: shown at once, web/index.js names each step and takes it away after the first frame */
  #loading { position: fixed; inset: 0; background: #000; color: #ddd; display: flex; flex-direction: column;
             align-items: center; justify-content: center; font-family: "Tiny5", monospace; z-index: 10; }
  #loading-title { font-size: 48px; }
  #loading-step { font-size: 18px; color: #888; margin-top: 12px; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="loading"><div id="loading-title">hunter2</div><div id="loading-step">starting WebGPU</div></div>
<script type="module" src="index.js"></script>
</body>
</html>
